<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期货对数中枢标准差通道 — 全品种仪表盘</title>
<script src="echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px}
/* Top bar */
.topbar{background:#fff;padding:12px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:700;color:#1a1a2e}
.topbar .meta{display:flex;align-items:center;gap:16px}
.topbar .update-time{font-size:12px;color:#888}
.topbar .update-time span{color:#1890ff;font-weight:600}
.search-box{padding:6px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;width:200px;outline:none}
.search-box:focus{border-color:#1890ff}
/* Filter bar */
.filter-bar{background:#fff;margin:8px 16px;padding:12px 20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-group label{font-size:12px;color:#888;font-weight:600;white-space:nowrap}
.chip{padding:4px 12px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;transition:all .2s}
.chip:hover{border-color:#1890ff}
.chip.active{background:#1890ff;color:#fff;border-color:#1890ff}
/* Stats summary */
.stats-bar{display:flex;gap:12px;margin:8px 16px;flex-wrap:wrap}
.stat-card{background:#fff;padding:10px 20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;min-width:120px}
.stat-card .num{font-size:24px;font-weight:700}
.stat-card .label{font-size:11px;color:#888;margin-top:2px}
.stat-card.overbought .num{color:#e74c3c}
.stat-card.oversold .num{color:#27ae60}
.stat-card.neutral .num{color:#7f8c8d}
.stat-card.total .num{color:#1890ff}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;padding:8px 16px 24px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.card.sig-overbought{border-color:#e74c3c}
.card.sig-high{border-color:#f39c12}
.card.sig-neutral{border-color:#dcdcdc}
.card.sig-low{border-color:#2ecc71}
.card.sig-oversold{border-color:#27ae60}
.card-header{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0}
.card-header .name{font-size:14px;font-weight:700;color:#1a1a2e}
.card-header .code{font-size:11px;color:#999;background:#f5f5f5;padding:2px 6px;border-radius:4px}
.card-header .signal{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.signal.overbought{background:#fdeaea;color:#e74c3c}
.signal.high{background:#fef5e7;color:#f39c12}
.signal.neutral{background:#f5f5f5;color:#999}
.signal.low{background:#eafaf1;color:#2ecc71}
.signal.oversold{background:#e8f8f0;color:#27ae60}
.card-chart{width:100%;height:160px}
.card-footer{padding:6px 12px;display:flex;justify-content:space-between;font-size:11px;color:#666;border-top:1px solid #f0f0f0}
.card-footer .metric{display:flex;flex-direction:column;align-items:center}
.card-footer .metric .v{font-weight:600;color:#333}
.card-footer .metric .k{color:#aaa;font-size:10px}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;display:none;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:90%;max-width:1100px;max-height:90vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff;z-index:1}
.modal-header .title{font-size:18px;font-weight:700}
.modal-close{font-size:24px;cursor:pointer;color:#999;line-height:1;padding:4px 8px;border:none;background:none}
.modal-close:hover{color:#333}
.modal-chart{width:100%;height:500px;padding:0 8px}
.modal-stats{padding:12px 24px;display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #f0f0f0}
.modal-stats .stat{display:flex;flex-direction:column}
.modal-stats .stat .k{font-size:11px;color:#aaa}
.modal-stats .stat .v{font-size:15px;font-weight:600}
/* ETF holdings chart in modal */
.modal-etf{padding:0 8px;border-top:1px solid #f0f0f0;display:none}
/* Spot price section */
.spot-section{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:4px 16px 0;padding:12px 16px}
.spot-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;padding-bottom:8px;margin-bottom:8px}
.spot-header .name{font-size:15px;font-weight:700;color:#1a1a2e}
.spot-header .meta{font-size:11px;color:#999}
.spot-chart{width:100%;height:300px}
.modal-etf-title{padding:12px 16px 4px;font-size:14px;font-weight:600;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.modal-etf-title .etf-tag{font-size:11px;font-weight:400;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:10px}
#modalEtfChart{width:100%;height:280px}
/* Loading */
.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:50}
.loading .spinner{width:40px;height:40px;border:4px solid #f0f0f0;border-top:4px solid #1890ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading" id="loading">
<div class="spinner"></div>
<div>正在加载全品种通道数据...</div>
</div>

<!-- Top bar -->
<div class="topbar">
<h1>期货对数中枢标准差通道 · 全品种仪表盘</h1>
<div class="meta">
<input type="text" class="search-box" id="search" placeholder="搜索品种名/代码...">
<span class="update-time">最后更新: <span id="updateTime">--</span></span>
</div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar"></div>

<!-- Filters -->
<div class="filter-bar">
<div class="filter-group">
<label>板块</label>
<div id="sectorChips"></div>
</div>
<div class="filter-group">
<label>信号</label>
<div id="signalChips"></div>
</div>
</div>

<!-- Spot price section (来自本地Excel) -->
<div class="spot-section" id="spotSection" style="display:none">
<div class="spot-header">
<span class="name">📊 现货价格 / 调研数据</span>
<span class="meta">数据来源: 本地Excel · 最后更新 <span id="spotUpdateTime">--</span></span>
</div>
<div class="spot-chart" id="spotChart"></div>
</div>

<!-- Grid -->
<div class="grid" id="grid"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
<div class="modal">
<div class="modal-header">
<span class="title" id="modalTitle">--</span>
<button class="modal-close" onclick="closeModal()">&times;</button>
</div>
<div class="modal-chart" id="modalChart"></div>
<div class="modal-etf" id="modalEtf">
<div class="modal-etf-title"><span>ETF持仓量趋势</span><span class="etf-tag" id="etfTag"></span></div>
<div id="modalEtfChart"></div>
</div>
<div class="modal-stats" id="modalStats"></div>
</div>
</div>

<script>
let DATA = null;
let activeSector = '全部';
let activeSignal = '全部';
let searchTerm = '';
const miniCharts = [];
let modalChart = null;
let modalEtfChart = null;

// Sector colors
const sectorColors = {
'黑色系': '#34495e','有色': '#e67e22','贵金属': '#f1c40f',
'农产品': '#9b59b6','能源化工': '#e74c3c','新能源': '#1abc9c'
};

// Signal meta
const signalMeta = {
'超买':{cls:'overbought',color:'#e74c3c'},'偏高':{cls:'high',color:'#f39c12'},
'中性':{cls:'neutral',color:'#999'},'偏低':{cls:'low',color:'#2ecc71'},
'超卖':{cls:'oversold',color:'#27ae60'}
};

async function loadData(){
const resp = await fetch('data.json');
DATA = await resp.json();
document.getElementById('updateTime').textContent = DATA.last_update;
document.getElementById('loading').style.display = 'none';
renderStats();
renderFilters();
renderGrid();
renderSpot();
}

function renderSpot(){
const section = document.getElementById('spotSection');
const chartEl = document.getElementById('spotChart');
if(!DATA.spot_data || !DATA.spot_data.series || !DATA.spot_data.series.length){
section.style.display = 'none';
return;
}
section.style.display = 'block';
document.getElementById('spotUpdateTime').textContent = DATA.spot_update || DATA.spot_data.latest_date || '';
const s = DATA.spot_data;
const palette = ['#1e88e5','#e53935','#43a047','#fb8c00','#8e24aa','#00acc1','#d81b60','#6d4c41','#3949ab','#f4511e'];
const series = s.series.map((item,i)=>({
name:item.name,
type:'line',
data:item.values,
smooth:true,
showSymbol:false,
lineStyle:{width:2,color:palette[i%palette.length]},
itemStyle:{color:palette[i%palette.length]},
emphasis:{focus:'series'}
}));
const spotChart = echarts.init(chartEl);
spotChart.setOption({
tooltip:{trigger:'axis'},
legend:{type:'scroll',top:0,textStyle:{fontSize:11}},
grid:{left:55,right:20,top:34,bottom:28},
xAxis:{type:'category',data:s.dates,axisLabel:{fontSize:10}},
yAxis:{type:'value',scale:true,axisLabel:{fontSize:10}},
series:series,
dataZoom:[{type:'inside',start:Math.max(0,100-1800/s.dates.length*100),end:100},{type:'slider',height:16,bottom:2,show:true}]
});
spotChart.resize();
if(window.__spotChart) window.__spotChart.dispose();
window.__spotChart = spotChart;
}

function renderStats(){
const products = DATA.products;
const ob = products.filter(p=>p.signal==='超买').length;
const hi = products.filter(p=>p.signal==='偏高').length;
const lo = products.filter(p=>p.signal==='偏低').length;
const os = products.filter(p=>p.signal==='超卖').length;
const nt = products.filter(p=>p.signal==='中性').length;
const stats = [
{label:'品种总数',num:products.length,cls:'total'},
{label:'超买',num:ob,cls:'overbought'},
{label:'偏高',num:hi,cls:'high'},
{label:'中性',num:nt,cls:'neutral'},
{label:'偏低',num:lo,cls:'low'},
{label:'超卖',num:os,cls:'oversold'},
];
document.getElementById('statsBar').innerHTML = stats.map(s=>
`<div class="stat-card ${s.cls}"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`
).join('');
}

function renderFilters(){
const sectors = ['全部',...new Set(DATA.products.map(p=>p.sector))];
const signals = ['全部','超买','偏高','中性','偏低','超卖'];
document.getElementById('sectorChips').innerHTML = sectors.map(s=>
`<span class="chip ${s===activeSector?'active':''}" onclick="setSector('${s}')">${s}</span>`
).join('');
document.getElementById('signalChips').innerHTML = signals.map(s=>
`<span class="chip ${s===activeSignal?'active':''}" onclick="setSignal('${s}')">${s}</span>`
).join('');
}

function setSector(s){activeSector=s;renderFilters();renderGrid();}
function setSignal(s){activeSignal=s;renderFilters();renderGrid();}

function getFiltered(){
return DATA.products.filter(p=>{
if(activeSector!=='全部' && p.sector!==activeSector) return false;
if(activeSignal!=='全部' && p.signal!==activeSignal) return false;
if(searchTerm){
const t = searchTerm.toLowerCase();
if(!p.name.toLowerCase().includes(t) && !p.code.toLowerCase().includes(t)) return false;
}
return true;
});
}

function renderGrid(){
// Dispose old charts
miniCharts.forEach(c=>{if(c)c.dispose();});
miniCharts.length = 0;

const filtered = getFiltered();
const grid = document.getElementById('grid');
grid.innerHTML = '';

filtered.forEach((p,idx)=>{
const sig = signalMeta[p.signal] || signalMeta['中性'];
const card = document.createElement('div');
card.className = `card sig-${sig.cls}`;
card.onclick = ()=>openModal(p);

const metricsHtml = `
<div class="metric"><span class="v">${p.latest_price}</span><span class="k">最新价</span></div>
<div class="metric"><span class="v">${p.sigma.toFixed(3)}</span><span class="k">σ</span></div>
<div class="metric"><span class="v">${p.sigma_pos>0?'+':''}${p.sigma_pos}</span><span class="k">σ分位</span></div>
<div class="metric"><span class="v">${p.dev_pct}%</span><span class="k">偏离</span></div>
`;

card.innerHTML = `
<div class="card-header">
<div><span class="name">${p.name}</span> <span class="code">${p.code}</span></div>
<span class="signal ${sig.cls}">${p.signal}</span>
</div>
<div class="card-chart" id="mini-${idx}"></div>
<div class="card-footer">${metricsHtml}</div>
`;
grid.appendChild(card);

// Create mini chart
setTimeout(()=>createMiniChart(`mini-${idx}`, p),50+idx*30);
});
}

function createMiniChart(domId, p){
const dom = document.getElementById(domId);
if(!dom) return;
const chart = echarts.init(dom);
miniCharts.push(chart);

// Show last 250 days
const n = p.dates.length;
const start = Math.max(0, n-250);
const dates = p.dates.slice(start);

const series = [
{name:'价格',type:'line',data:p.price.slice(start),lineStyle:{width:1.5,color:'#1890ff'},showSymbol:false},
{name:'中枢',type:'line',data:p.center_line.slice(start),lineStyle:{width:1,color:'#666',type:'dashed'},showSymbol:false},
{name:'+1σ',type:'line',data:p.u1.slice(start),lineStyle:{width:0.8,color:'#e74c3c',type:'dotted'},showSymbol:false},
{name:'-1σ',type:'line',data:p.l1.slice(start),lineStyle:{width:0.8,color:'#27ae60',type:'dotted'},showSymbol:false},
{name:'+2σ',type:'line',data:p.u2.slice(start),lineStyle:{width:0.6,color:'#e74c3c',opacity:0.4,type:'dotted'},showSymbol:false},
{name:'-2σ',type:'line',data:p.l2.slice(start),lineStyle:{width:0.6,color:'#27ae60',opacity:0.4,type:'dotted'},showSymbol:false},
];

chart.setOption({
grid:{left:5,right:5,top:5,bottom:5},
xAxis:{type:'category',data:dates,show:false},
yAxis:{type:'value',scale:true,show:false},
series:series,
tooltip:{trigger:'axis',formatter:function(params){
let s = params[0].axisValue + '<br/>';
params.forEach(pm=>{
s += `${pm.marker}${pm.seriesName}: ${pm.value}<br/>`;
});
return s;
}},
animation:false,
});
}

function openModal(p){
document.getElementById('modal').classList.add('show');
document.getElementById('modalTitle').textContent = `${p.exchange} · ${p.name} (${p.code})`;

// Stats
let etfStatsHtml = '';
if (DATA.etf_holdings) {
    if (p.code === 'au') {
        if (DATA.etf_holdings.gold_global)
            etfStatsHtml += `<div class="stat"><span class="k">全球ETF持仓</span><span class="v">${DATA.etf_holdings.gold_global.latest} 吨</span></div>`;
        if (DATA.etf_holdings.gold_china)
            etfStatsHtml += `<div class="stat"><span class="k">中国ETF持仓</span><span class="v">${DATA.etf_holdings.gold_china.latest} 吨</span></div>`;
        if (DATA.etf_holdings.gold_global && DATA.etf_holdings.gold_china) {
            const diff = (DATA.etf_holdings.gold_global.latest - DATA.etf_holdings.gold_china.latest).toFixed(2);
            etfStatsHtml += `<div class="stat"><span class="k">非中国ETF持仓</span><span class="v">${diff} 吨</span></div>`;
        }
    } else if (p.code === 'ag') {
        if (DATA.etf_holdings.silver_slv)
            etfStatsHtml += `<div class="stat"><span class="k">SLV持仓</span><span class="v">${DATA.etf_holdings.silver_slv.latest} 吨</span></div>`;
    }
}
const statsHtml = `
<div class="stat"><span class="k">板块</span><span class="v">${p.sector}</span></div>
<div class="stat"><span class="k">交易所</span><span class="v">${p.exchange}</span></div>
<div class="stat"><span class="k">σ(log)</span><span class="v">${p.sigma.toFixed(4)}</span></div>
<div class="stat"><span class="k">±1σ</span><span class="v">±${(p.sigma*100).toFixed(1)}%</span></div>
<div class="stat"><span class="k">±2σ</span><span class="v">±${(p.sigma*200).toFixed(1)}%</span></div>
<div class="stat"><span class="k">σ分位</span><span class="v">${p.sigma_pos>0?'+':''}${p.sigma_pos}σ</span></div>
<div class="stat"><span class="k">最新价</span><span class="v">${p.latest_price} ${p.unit}</span></div>
<div class="stat"><span class="k">中枢</span><span class="v">${p.center}</span></div>
<div class="stat"><span class="k">偏离</span><span class="v">${p.dev_pct}%</span></div>
<div class="stat"><span class="k">样本天数</span><span class="v">${p.n_days}</span></div>
<div class="stat"><span class="k">信号</span><span class="v" style="color:${(signalMeta[p.signal]||{}).color||'#333'}">${p.signal}</span></div>
${etfStatsHtml}
`;
document.getElementById('modalStats').innerHTML = statsHtml;

// Full chart
setTimeout(()=>{
if(modalChart) modalChart.dispose();
modalChart = echarts.init(document.getElementById('modalChart'));
const sig = signalMeta[p.signal] || signalMeta['中性'];
const sigColor = sig.color;

modalChart.setOption({
title:{text:`${p.name} 对数价格中枢及标准差通道`,subtext:`σ=${p.sigma.toFixed(4)} | σ分位=${p.sigma_pos>0?'+':''}${p.sigma_pos} | ${p.signal}`,left:'center',textStyle:{fontSize:16},subtextStyle:{color:sigColor,fontSize:13}},
tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
legend:{data:['收盘价','中枢','+1σ','-1σ','+2σ','-2σ'],top:55,left:'center',itemWidth:20,itemHeight:8},
grid:{left:60,right:30,top:90,bottom:60},
xAxis:{type:'category',data:p.dates,axisLabel:{formatter:function(v){return v.substring(0,7);},interval:Math.floor(p.dates.length/8)}},
yAxis:{type:'value',scale:true,axisLabel:{formatter:function(v){return v.toFixed(0);}}},
dataZoom:[{type:'inside',start:60,end:100},{type:'slider',start:60,end:100,bottom:10}],
series:[
{name:'收盘价',type:'line',data:p.price,lineStyle:{width:1.5,color:'#1890ff'},showSymbol:false},
{name:'中枢',type:'line',data:p.center_line,lineStyle:{width:1.5,color:'#333',type:'dashed'},showSymbol:false},
{name:'+1σ',type:'line',data:p.u1,lineStyle:{width:1,color:'#e74c3c',type:'dotted'},showSymbol:false},
{name:'-1σ',type:'line',data:p.l1,lineStyle:{width:1,color:'#27ae60',type:'dotted'},showSymbol:false},
{name:'+2σ',type:'line',data:p.u2,lineStyle:{width:0.8,color:'#e74c3c',opacity:0.5,type:'dotted'},showSymbol:false},
{name:'-2σ',type:'line',data:p.l2,lineStyle:{width:0.8,color:'#27ae60',opacity:0.5,type:'dotted'},showSymbol:false},
],
});
},100);

// ETF holdings chart
const modalEtf = document.getElementById('modalEtf');
if (DATA.etf_holdings && (p.code === 'au' || p.code === 'ag')) {
    modalEtf.style.display = 'block';
    setTimeout(()=>{
        if(modalEtfChart) modalEtfChart.dispose();
        modalEtfChart = echarts.init(document.getElementById('modalEtfChart'));
        let series = [];
        let legends = [];
        let yAxis = [];
        let xDates = [];

        if (p.code === 'au') {
            const g = DATA.etf_holdings.gold_global;
            const c = DATA.etf_holdings.gold_china;
            let globalVals = [], chinaVals = [], diffVals = [];
            if (g && c) {
                const chinaMap = {};
                for (let i = 0; i < c.dates.length; i++) chinaMap[c.dates[i]] = c.values[i];
                for (let i = 0; i < g.dates.length; i++) {
                    const d = g.dates[i];
                    if (chinaMap[d] !== undefined) {
                        xDates.push(d);
                        globalVals.push(g.values[i]);
                        chinaVals.push(chinaMap[d]);
                        diffVals.push(parseFloat((g.values[i] - chinaMap[d]).toFixed(2)));
                    }
                }
            } else if (g) {
                xDates = g.dates; globalVals = g.values;
            } else if (c) {
                xDates = c.dates; chinaVals = c.values;
            }
            if (globalVals.length) {
                series.push({name:'全球黄金ETF持仓量',type:'line',data:globalVals,lineStyle:{width:1.5,color:'#f1c40f'},showSymbol:false});
                legends.push('全球黄金ETF持仓量');
            }
            if (chinaVals.length) {
                series.push({name:'中国大陆黄金ETF持仓量',type:'line',data:chinaVals,lineStyle:{width:1.5,color:'#e74c3c'},showSymbol:false,yAxisIndex:1});
                legends.push('中国大陆黄金ETF持仓量');
            }
            if (diffVals.length) {
                series.push({name:'全球非中国大陆黄金ETF',type:'line',data:diffVals,lineStyle:{width:1.5,color:'#3498db'},showSymbol:false,yAxisIndex:2});
                legends.push('全球非中国大陆黄金ETF');
            }
            yAxis = [
                {type:'value',scale:true,name:'全球(吨)',position:'left',axisLabel:{formatter:function(v){return v.toFixed(0);}}},
                {type:'value',scale:true,name:'中国(吨)',position:'right',axisLabel:{formatter:function(v){return v.toFixed(0);}}},
                {type:'value',scale:true,name:'非中国(吨)',position:'right',offset:60,axisLabel:{formatter:function(v){return v.toFixed(0);}}}
            ];
            document.getElementById('etfTag').textContent = '周频';
        } else if (p.code === 'ag') {
            const s = DATA.etf_holdings.silver_slv;
            if (s) {
                xDates = s.dates;
                series.push({name:s.name,type:'line',data:s.values,lineStyle:{width:1.5,color:'#7f8c8d'},showSymbol:false});
                legends.push(s.name);
            }
            yAxis = [{type:'value',scale:true,name:'吨',axisLabel:{formatter:function(v){return v.toFixed(0);}}}];
            document.getElementById('etfTag').textContent = '日频';
        }

        modalEtfChart.setOption({
            tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
            legend:{data:legends,top:5,left:'center',itemWidth:20,itemHeight:8},
            grid:{left:70,right:70,top:40,bottom:40},
            xAxis:{type:'category',data:xDates,axisLabel:{formatter:function(v){return v.substring(0,7);}}},
            yAxis:yAxis,
            dataZoom:[{type:'inside',start:50,end:100},{type:'slider',start:50,end:100,bottom:5}],
            series:series,
        });
    },200);
} else {
    modalEtf.style.display = 'none';
}
}

function closeModal(){
document.getElementById('modal').classList.remove('show');
if(modalChart){modalChart.dispose();modalChart=null;}
if(modalEtfChart){modalEtfChart.dispose();modalEtfChart=null;}
}

// Search
document.getElementById('search').addEventListener('input',function(e){
searchTerm = e.target.value;
renderGrid();
});

// Close modal on overlay click
document.getElementById('modal').addEventListener('click',function(e){
if(e.target===this) closeModal();
});

// ESC to close
document.addEventListener('keydown',function(e){
if(e.key==='Escape') closeModal();
});

// Resize
window.addEventListener('resize',function(){
miniCharts.forEach(c=>{if(c)c.resize();});
if(modalChart) modalChart.resize();
if(modalEtfChart) modalEtfChart.resize();
if(window.__spotChart) window.__spotChart.resize();
});

// Start
loadData();
</script>
</body>
</html>
